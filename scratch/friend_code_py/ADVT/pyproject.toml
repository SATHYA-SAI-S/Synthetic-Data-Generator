[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advt"
version = "0.1.0"
description = "Privacy-Preserving Synthetic Healthcare Data Generation Framework"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "opacus>=1.4.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0"
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true
